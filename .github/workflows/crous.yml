name: Veille logements CROUS

on:
  schedule:
    # Toutes les 5 minutes (minimum autorisé par GitHub). (GitHub peut retarder les crons en cas de forte charge.)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet Actions
  repository_dispatch:    # déclenchement externe fiable (ex : cron-job.org)
    types: [crous-check]

# Nécessaire pour committer l'état (annonces déjà vues) dans le dépôt.
permissions:
  contents: write

concurrency:
  group: crous-veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer le scraper
        id: scrape
        env:
          SEARCH_URL: ${{ vars.SEARCH_URL }}
        run: python scraper.py

      # Un message séparé par destinataire (personne ne voit les adresses des autres).
      - name: Envoyer les emails si nouveau logement
        if: steps.scrape.outputs.has_new == 'true'
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_TO_EXTRA: ${{ secrets.MAIL_TO_EXTRA }}
          MAIL_TO_WISSAL: ${{ secrets.MAIL_TO_WISSAL }}
          MAIL_SUBJECT: ${{ steps.scrape.outputs.subject }}
          MAIL_HTML_FILE: notification.html
        run: python send_mail.py

      - name: Sauvegarder l'état (annonces déjà vues)
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: maj état veille CROUS [skip ci]"
            git push
          else
            echo "État inchangé, rien à committer."
          fi
