name: Veille logements CROUS

on:
  schedule:
    # Toutes les 15 minutes. (GitHub peut retarder les crons en cas de forte charge.)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet Actions

# Nécessaire pour committer l'état (annonces déjà vues) dans le dépôt.
permissions:
  contents: write

concurrency:
  group: crous-veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer le scraper
        id: scrape
        env:
          SEARCH_URL: ${{ vars.SEARCH_URL }}
        run: python scraper.py

      - name: Envoyer l'email si nouveau logement
        if: steps.scrape.outputs.has_new == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.scrape.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: Veille CROUS <${{ secrets.MAIL_USERNAME }}>
          html_body: file://notification.html

      - name: Sauvegarder l'état (annonces déjà vues)
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: maj état veille CROUS [skip ci]"
            git push
          else
            echo "État inchangé, rien à committer."
          fi
