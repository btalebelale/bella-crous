name: Test email (manuel)

# Envoie un mail de test à chaque destinataire (secrets MAIL_TO*), un message
# séparé par personne. Sert à vérifier la configuration email sans attendre
# qu'un logement se libère.
# L'entrée « to » permet de ne tester qu'une seule adresse, par exemple après
# avoir ajouté quelqu'un, sans envoyer de mail inutile aux autres.
on:
  workflow_dispatch:
    inputs:
      to:
        description: "Tester une seule adresse (laisser vide = tous les destinataires)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Envoyer un email de test à chaque destinataire
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_TO_EXTRA: ${{ secrets.MAIL_TO_EXTRA }}
          MAIL_TO_WISSAL: ${{ secrets.MAIL_TO_WISSAL }}
          ONLY_TO: ${{ inputs.to }}
          MAIL_SUBJECT: "✅ Test veille CROUS"
          MAIL_HTML: |
            <div style="font-family:Arial,sans-serif;max-width:600px">
              <h2 style="color:#000091">✅ Test de la veille CROUS</h2>
              <p>Si tu reçois ce message, tu es bien dans la liste des
                 destinataires des alertes logement.</p>
              <p style="color:#999;font-size:12px">Mail de test envoyé
                 manuellement, aucune annonce n'est concernée.</p>
            </div>
        run: |
          # Adresse unique demandée : on écarte tous les autres MAIL_TO_*
          # pour ne déranger personne d'autre.
          if [[ -n "$ONLY_TO" ]]; then
            unset "${!MAIL_TO@}"
            export MAIL_TO="$ONLY_TO"
          fi
          python send_mail.py
